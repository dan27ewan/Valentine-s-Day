<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Phone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="phone">
        <div id="screen">
            <h2 id="question">Will you be my Valentine, Jenica Lyn?(mybabygirl) 💖</h2>
            <div id="gifContainer">
              <img id="pic" src="Cute.gif" alt="Valentine Picture">
              <div id="rightMessage"></div>
            </div>  
            <div id="message"></div>
            <button id="yesBtn">YES 💕</button>
            <button id="noBtn">NO 💔</button>
            <button id="continueBtn">Continue 💌</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
